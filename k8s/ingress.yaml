apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: passgen
  annotations:
    # Mirror the code-poets-society / beleganski-jaas pattern:
    # NPM is the public edge (TLS termination + Let's Encrypt for
    # passgen.dporkov.tech). Traefik is the internal router only —
    # it accepts plain HTTP from NPM and matches by Host header.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: passgen.dporkov.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: passgen
                port:
                  name: http
